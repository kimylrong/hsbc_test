[project]
name = "house-price-predictor"
version = "1.0.0"
description = "House price prediction API using FastAPI + RandomForest"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.14.4",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
