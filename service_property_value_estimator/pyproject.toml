[project]
name = "property-value-estimator"
version = "1.0.0"
description = "Property Value Estimator backend (FastAPI + SQLite) for the unified portal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"