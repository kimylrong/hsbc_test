global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ml-predictor-api
    static_configs:
      - targets: ["ml-predictor-api:8010"]
    metrics_path: /metrics

  - job_name: property-value-estimator
    static_configs:
      - targets: ["property-value-estimator:8020"]
    metrics_path: /metrics

  - job_name: property-market-analysis
    static_configs:
      - targets: ["property-market-analysis:8030"]
    metrics_path: /metrics

  - job_name: web-portal
    static_configs:
      - targets: ["web-portal:8000"]
    metrics_path: /api/metrics